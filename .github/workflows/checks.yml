name: backend
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: homie
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.13'
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy app && uv run pytest
      - run: uv run alembic upgrade head && uv run alembic check
        env:
          DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/homie
      - run: uv run python export_contract.py && git diff --exit-code -- openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json
      - run: docker build -t homie-api .
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
